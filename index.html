<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小紅花花園</title>
<link rel="stylesheet" href="https://db.onlinewebfonts.com/c/2bf40ab72ea4897a3fd9b6e48b233a19?family=Garamond">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<script>tailwind = { config: { corePlugins: { preflight: false } } };</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script type="importmap">
{ "imports": {
  "react": "https://esm.sh/react@18.3.1",
  "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
  "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",

} }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;800&display=swap" rel="stylesheet">
<style>
/* 版面概念：手機單欄。上方是大數字，中間是會越長越滿的花園，下方是今天三餐、本週、紀錄。 */
:root {
  --bg: #f1f5ec;
  --surface: #fbfdf8;
  --ink: #1d3a2a;
  --muted: #5d7566;
  --line: #d5e0cf;
  --red: #d3253a;
  --red-soft: #fbe3e5;
  --leaf: #3f7d52;
  --soil: #8a6a4f;
  --soil-bg: #e7e0d2;
  --warn: #b7791f;
  --warn-soft: #fbefd5;
  --on-red: #ffffff;
  --font-display: "Noto Serif TC", "Songti TC", serif;
  --font-body: "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a14; --surface: #172420; --ink: #e5f0e6; --muted: #92aa9a; --line: #2b3f33;
    --red: #ef5266; --red-soft: #3a1c22; --leaf: #6fbf84; --soil: #b99677; --soil-bg: #231f19;
    --warn: #e5b25a; --warn-soft: #33290f; --on-red: #1a0a0d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a14; --surface: #172420; --ink: #e5f0e6; --muted: #92aa9a; --line: #2b3f33;
  --red: #ef5266; --red-soft: #3a1c22; --leaf: #6fbf84; --soil: #b99677; --soil-bg: #231f19;
  --warn: #e5b25a; --warn-soft: #33290f; --on-red: #1a0a0d; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  margin: 0;
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); }
section[id], #today, #garden, #week, #log { scroll-margin-top: 16px; }

/* 影片開場 */
#hero-root, #hero-root * { box-sizing: border-box; }
#hero-root h1, #hero-root p, #hero-root nav, #hero-root div, #hero-root a, #hero-root span { margin: 0; padding: 0; }
#hero-root { font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; color: #fff; background: #010101; -webkit-font-smoothing: antialiased; }
#hero-root a { text-decoration: none; }
#hero-root .px-5 { padding-left: 1.25rem; padding-right: 1.25rem; }
.font-garamond { font-family: 'Garamond', 'Times New Roman', 'Noto Serif TC', serif; }
.mobile-menu-glass { background: rgba(10, 10, 10, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1); }
.liquid-glass { background: rgba(255, 255, 255, 0.01); background-blend-mode: luminosity; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border: none; box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1); position: relative; overflow: hidden; display: inline-block; }
.liquid-glass::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.4px;
  background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.liquid-glass:hover { background: rgba(255, 255, 255, 0.04); box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.15); }
.liquid-glass:active { transform: scale(0.98); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--leaf); outline-offset: 2px; }
h1, h2 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h2 { font-size: 18px; }
.eyebrow { font-size: 13px; letter-spacing: .08em; color: var(--muted); margin: 0; }

/* 頂部 */
.hero { display: flex; flex-direction: column; gap: 4px; }
.hero .count { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.hero .num { font-family: var(--font-display); font-weight: 800; font-size: 76px; line-height: 1; color: var(--red); font-variant-numeric: tabular-nums; }
.hero .unit { font-family: var(--font-display); font-size: 22px; font-weight: 600; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
.chip b { color: var(--red); }

/* 花園 */
.garden { position: relative; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); padding: 14px 10px 0; overflow: hidden; }
.garden-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 0; min-height: 110px; }
.flower { width: 100%; height: 64px; display: block; transform-origin: 50% 100%; }
.flower.new { animation: bloom .9s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes bloom { from { transform: scale(0) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
.soil { height: 14px; margin: 0 -10px; background: var(--soil-bg); border-top: 2px solid var(--soil); }
.garden-empty { grid-column: 1 / -1; align-self: center; text-align: center; color: var(--muted); padding: 22px 8px; }

/* 今天三餐 */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.panel-head span { color: var(--muted); font-size: 14px; }
.meals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.meal { border: 1.5px solid var(--line); background: var(--bg); border-radius: 14px; padding: 12px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 92px; justify-content: center; }
.meal .name { font-weight: 700; }
.meal .state { font-size: 13px; color: var(--muted); }
.meal.open { border-color: var(--red); }
.meal.open .state { color: var(--red); font-weight: 700; }
.meal.pending { background: var(--warn-soft); border-color: var(--warn); }
.meal.pending .state { color: var(--warn); font-weight: 700; }
.meal.done { background: var(--red-soft); border-color: var(--red); cursor: default; }
.meal.done .state { color: var(--red); font-weight: 700; }
.meal:disabled { cursor: default; }
.mini { width: 26px; height: 26px; }

/* 待確認（他） */
.pending-list { display: flex; flex-direction: column; gap: 10px; }
.pitem { border: 1.5px solid var(--warn); background: var(--warn-soft); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.pitem .who { font-weight: 700; }
.pitem .quote { margin: 0; color: var(--muted); font-size: 15px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 16px; font-weight: 700; min-height: 44px; }
.btn.primary { background: var(--red); border-color: var(--red); color: var(--on-red); }
.btn.ghost { color: var(--muted); }
input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 44px; }

/* 本週 */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; }
.day { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; border-radius: 12px; border: 1px solid transparent; }
.day.today { border-color: var(--red); }
.day .d { font-size: 13px; color: var(--muted); }
.dots { display: flex; flex-direction: column; gap: 3px; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line); }
.dot.on { background: var(--red); border-color: var(--red); }
.dot.wait { background: var(--warn); border-color: var(--warn); }
.dot.future { opacity: .35; }
.legend { color: var(--muted); font-size: 13px; margin: 0; }

/* 紀錄 */
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.log li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.log li:first-child { border-top: 0; }
.log .when { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.log .what { min-width: 0; overflow-wrap: anywhere; }
.log .what b { font-weight: 700; }
.log .note { color: var(--muted); font-size: 15px; margin: 2px 0 0; }
.log .reply { color: var(--leaf); font-size: 15px; margin: 2px 0 0; }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; margin-left: 6px; background: var(--warn-soft); color: var(--warn); }
.tag.no { background: var(--line); color: var(--muted); }

/* 彈出面板 */
.sheet-wrap { position: fixed; inset: 0; background: rgba(10, 20, 14, .45); display: flex; align-items: flex-end; justify-content: center; z-index: 10; padding: 0 max(16px, env(safe-area-inset-left, 0px)) env(safe-area-inset-bottom, 0px); }
.sheet { width: 100%; max-width: 560px; background: var(--surface); border-radius: 20px 20px 0 0; padding: 18px 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.msg { color: var(--muted); text-align: center; padding: 40px 8px; }
.bonus summary { cursor: pointer; font-weight: 700; min-height: 32px; }
.bonus-body { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 15px; z-index: 20; }
@media (prefers-reduced-motion: reduce) { .flower.new { animation: none; } }
</style>
</head><body>
<div id="hero-root"></div>
<main id="app"><p class="msg">花園準備中…</p></main>
<div id="sheet-root"></div>
<div id="toast-root"></div>

<script src="config.js"></script>
<script>
(function () {
  // ---------- 設定 ----------
  var MEALS = [
    { key: "breakfast", name: "早餐" },
    { key: "lunch", name: "午餐" },
    { key: "dinner", name: "晚餐" }
  ];
  // 獎勵兌換先關閉。之後打開時：花的餘額 = 已確認的花 - 已兌換的花，兌換紀錄放在 rewards 集合。
  var REWARDS_ENABLED = false;

  var cfg = window.GARDEN_CONFIG || {};
  var db = null, isHer = true, docs = [], loaded = false, prevCount = null, busy = false;
  function api(path, opts) {
    opts = opts || {};
    var h = { apikey: cfg.SUPABASE_ANON_KEY, "Content-Type": "application/json" };
    if (cfg.SUPABASE_ANON_KEY.indexOf("eyJ") === 0) h.Authorization = "Bearer " + cfg.SUPABASE_ANON_KEY;
    if (opts.prefer) h.Prefer = opts.prefer;
    return fetch(cfg.SUPABASE_URL + "/rest/v1/" + path, { method: opts.method || "GET", headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.status === 204 ? null : r.text().then(function (t) { return t ? JSON.parse(t) : null; }); });
  }
  async function refresh() {
    try { docs = await api("meals?select=*&order=ts.desc&limit=500"); loaded = true; render(); }
    catch (e) { if (!loaded) { toast("連不上資料庫，請檢查設定"); } }
  }

  // ---------- 小工具 ----------
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k.indexOf("on") === 0) n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  var SVGNS = "http://www.w3.org/2000/svg";
  function svg(tag, attrs, kids) {
    var n = document.createElementNS(SVGNS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    (kids || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function dateKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function mealName(k) { for (var i = 0; i < MEALS.length; i++) if (MEALS[i].key === k) return MEALS[i].name; return "特別加花"; }
  function toast(t) {
    var r = document.getElementById("toast-root");
    r.textContent = "";
    var n = el("div", { class: "toast", role: "status", text: t });
    r.appendChild(n);
    setTimeout(function () { if (n.parentNode) n.parentNode.removeChild(n); }, 2600);
  }

  // ---------- 花 ----------
  function seeded(i) { var x = Math.sin(i * 9301 + 49297) * 233280; return x - Math.floor(x); }
  function flowerSVG(i, cls) {
    var r1 = seeded(i + 1), r2 = seeded(i + 7), r3 = seeded(i + 13);
    var lean = (r1 - 0.5) * 16, scale = 0.85 + r2 * 0.25, petals = 5, hueShift = Math.round((r3 - 0.5) * 10);
    var s = svg("svg", { viewBox: "0 0 48 64", class: cls || "flower", "aria-hidden": "true" });
    var g = svg("g", { transform: "translate(24 62) rotate(" + lean.toFixed(1) + ") scale(" + scale.toFixed(2) + ") translate(-24 -62)" });
    g.appendChild(svg("path", { d: "M24 62 C24 50 24 42 24 30", stroke: "var(--leaf)", "stroke-width": "2.6", fill: "none", "stroke-linecap": "round" }));
    g.appendChild(svg("path", { d: "M24 50 C16 48 13 43 13 38 C20 38 24 43 24 50 Z", fill: "var(--leaf)" }));
    for (var p = 0; p < petals; p++) {
      var a = p * (360 / petals);
      g.appendChild(svg("ellipse", { cx: "24", cy: "17", rx: "6.2", ry: "9", fill: "var(--red)", transform: "rotate(" + a + " 24 26)", opacity: (0.92 - hueShift * 0.004).toFixed(2) }));
    }
    g.appendChild(svg("circle", { cx: "24", cy: "26", r: "4.6", fill: "var(--soil)" }));
    g.appendChild(svg("circle", { cx: "24", cy: "26", r: "1.8", fill: "var(--surface)" }));
    s.appendChild(g);
    return s;
  }

  // ---------- 資料整理 ----------
  function derive() {
    var confirmed = docs.filter(function (d) { return d.status === "confirmed"; });
    var byDay = {};
    confirmed.forEach(function (d) { byDay[d.date] = (byDay[d.date] || 0) + 1; });
    var streak = 0, cur = new Date();
    if (!byDay[dateKey(cur)]) cur.setDate(cur.getDate() - 1);
    while (byDay[dateKey(cur)]) { streak++; cur.setDate(cur.getDate() - 1); }
    return { confirmed: confirmed, byDay: byDay, streak: streak };
  }
  function slotDoc(date, meal) {
    for (var i = 0; i < docs.length; i++) if (docs[i].date === date && docs[i].meal === meal) return docs[i];
    return null;
  }

  // ---------- 寫入 ----------
  async function write(fn, okMsg) {
    if (busy) return;
    busy = true;
    try { await fn(); if (okMsg) toast(okMsg); }
    catch (e) { toast("沒有成功，請再試一次"); }
    busy = false;
    await refresh();
  }
  function claim(meal, note) {
    var today = dateKey(new Date());
    var data = { date: today, meal: meal, status: isHer ? "pending" : "confirmed", note: note || "", reply: "", ts: Date.now() };
    return write(function () { data.id = today + "_" + meal; return api("meals?on_conflict=id", { method: "POST", prefer: "resolution=merge-duplicates,return=minimal", body: data }); }, isHer ? "已送出，等丞丞確認" : "已幫安安老大記上一朵");
  }
  function confirmDoc(d, reply) {
    return write(function () { return api("meals?id=eq." + encodeURIComponent(d.id), { method: "PATCH", prefer: "return=minimal", body: { status: "confirmed", reply: reply || "", ts: Date.now() } }); }, "已確認，花園長出一朵");
  }
  function rejectDoc(d, reply) {
    return write(function () { return api("meals?id=eq." + encodeURIComponent(d.id), { method: "PATCH", prefer: "return=minimal", body: { status: "rejected", reply: reply || "" } }); }, "已退回");
  }
  function addBonus(reason) {
    var today = dateKey(new Date()), ts = Date.now();
    return write(function () {
      return api("meals", { method: "POST", prefer: "return=minimal", body: { id: today + "_bonus_" + ts, date: today, meal: "bonus", status: "confirmed", note: reason || "", reply: "", ts: ts } });
    }, "特別加一朵");
  }

  // ---------- 彈出面板 ----------
  function openSheet(title, placeholder, okLabel, onOk) {
    var root = document.getElementById("sheet-root");
    root.textContent = "";
    var input = el("input", { type: "text", id: "sheet-input", placeholder: placeholder, maxlength: "80", "aria-label": placeholder });
    function close() { root.textContent = ""; }
    var wrap = el("div", { class: "sheet-wrap", onclick: function (e) { if (e.target === wrap) close(); } }, [
      el("div", { class: "sheet", role: "dialog", "aria-label": title }, [
        el("h2", { text: title }),
        input,
        el("div", { class: "row" }, [
          el("button", { class: "btn primary", text: okLabel, onclick: function () { var v = input.value.trim(); close(); onOk(v); } }),
          el("button", { class: "btn ghost", text: "取消", onclick: close })
        ])
      ])
    ]);
    root.appendChild(wrap);
    input.focus();
  }

  // ---------- 畫面 ----------
  function render() {
    var app = document.getElementById("app");
    app.textContent = "";
    if (!db) {
      app.appendChild(el("p", { class: "msg", text: "還沒設定資料庫。請照 README 填好 config.js。" }));
      return;
    }
    var info = derive();
    var count = info.confirmed.length;
    var today = new Date(), todayKey = dateKey(today);

    // 頂部
    var hero = el("section", { class: "hero" }, [
      el("p", { class: "eyebrow", text: isHer ? "今天也要乖乖吃飯" : "安安老大的小紅花" }),
      el("div", { class: "count" }, [
        el("span", { class: "num", text: String(count) }),
        el("span", { class: "unit", text: "朵小紅花" })
      ]),
      el("div", { class: "chips" }, [
        el("span", { class: "chip" }, ["連續 ", el("b", { text: String(info.streak) }), " 天"]),
        el("span", { class: "chip" }, ["本週 ", el("b", { text: String(weekCount(info)) }), " 朵"])
      ])
    ]);
    app.appendChild(hero);

    // 花園
    var grid = el("div", { class: "garden-grid" });
    if (!count) grid.appendChild(el("div", { class: "garden-empty", text: "花園還空著，第一朵花等你吃完飯長出來。" }));
    var sorted = info.confirmed.slice().sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); });
    sorted.forEach(function (d, i) {
      var isNew = prevCount !== null && count > prevCount && i >= prevCount;
      grid.appendChild(flowerSVG(i, "flower" + (isNew ? " new" : "")));
    });
    app.appendChild(el("section", { id: "garden", class: "garden", "aria-label": "花園，共 " + count + " 朵" }, [grid, el("div", { class: "soil" })]));
    prevCount = count;

    // 他：待確認
    if (!isHer) {
      var pend = docs.filter(function (d) { return d.status === "pending"; }).sort(function (a, b) { return a.ts - b.ts; });
      var pl = el("div", { class: "pending-list" });
      if (!pend.length) pl.appendChild(el("p", { class: "legend", text: "目前沒有等你確認的。" }));
      pend.forEach(function (d) {
        var note = d.note ? el("p", { class: "quote", text: "安安老大說：" + d.note }) : null;
        pl.appendChild(el("div", { class: "pitem" }, [
          el("div", { class: "who", text: shortDate(d.date) + " " + mealName(d.meal) + "，安安老大說吃完了" }),
          note,
          el("div", { class: "row" }, [
            el("button", { class: "btn primary", text: "確認，給安安老大一朵", onclick: function () { openSheet("想對安安老大說什麼？", "例如：今天好棒（可留空）", "確認", function (v) { confirmDoc(d, v); }); } }),
            el("button", { class: "btn", text: "退回", onclick: function () { openSheet("退回原因", "例如：還沒吃完喔（可留空）", "退回", function (v) { rejectDoc(d, v); }); } })
          ])
        ]));
      });
      app.appendChild(el("section", { class: "panel" }, [
        el("div", { class: "panel-head" }, [el("h2", { text: "等你確認" }), el("span", { text: pend.length ? pend.length + " 筆" : "" })]),
        pl
      ]));
    }

    // 今天三餐
    var mealsEl = el("div", { class: "meals" });
    MEALS.forEach(function (m) {
      var d = slotDoc(todayKey, m.key);
      var cls = "meal open", state = isHer ? "我吃完了" : "代記", disabled = false;
      if (d && d.status === "confirmed") { cls = "meal done"; state = "已領 🌸"; disabled = true; }
      else if (d && d.status === "pending") { cls = "meal pending"; state = "等丞丞確認"; disabled = isHer; if (!isHer) state = "待確認"; }
      else if (d && d.status === "rejected") { state = "再領一次"; }
      var kids = [el("span", { class: "name", text: m.name }), el("span", { class: "state", text: state.replace(" 🌸", "") })];
      if (d && d.status === "confirmed") kids.unshift(flowerSVG(0, "mini"));
      var btn = el("button", {
        class: cls, disabled: disabled ? "" : false,
        "aria-label": m.name + "，" + state,
        onclick: function () {
          if (!isHer && d && d.status === "pending") return;
          openSheet(isHer ? "吃完" + m.name + "了嗎？" : "幫安安老大記上" + m.name, isHer ? "想跟丞丞說什麼？（可留空）" : "備註（可留空）", isHer ? "送出" : "記上一朵", function (v) { claim(m.key, v); });
        }
      }, kids);
      if (disabled) btn.setAttribute("disabled", "");
      mealsEl.appendChild(btn);
    });
    var todayPanel = [
      el("div", { class: "panel-head" }, [el("h2", { text: "今天" }), el("span", { text: (today.getMonth() + 1) + " 月 " + today.getDate() + " 日" })]),
      mealsEl
    ];
    if (!isHer) {
      todayPanel.push(el("details", { class: "bonus" }, [
        el("summary", { text: "特殊情況，額外加一朵" }),
        el("div", { class: "bonus-body" }, [
          el("input", { type: "text", id: "bonus-reason", placeholder: "原因，例如：生病還是有吃藥", maxlength: "80", "aria-label": "額外加花的原因" }),
          el("div", { class: "row" }, [el("button", { class: "btn primary", text: "加一朵", onclick: function () { var v = document.getElementById("bonus-reason").value.trim(); addBonus(v); } })])
        ])
      ]));
    }
    app.appendChild(el("section", { id: "today", class: "panel" }, todayPanel));

    // 本週
    var week = el("div", { class: "week" });
    var mon = new Date(today); var wd = (mon.getDay() + 6) % 7; mon.setDate(mon.getDate() - wd);
    var names = ["一", "二", "三", "四", "五", "六", "日"];
    for (var i = 0; i < 7; i++) {
      var dt = new Date(mon); dt.setDate(mon.getDate() + i);
      var k = dateKey(dt), future = dt > today && k !== todayKey;
      var dots = el("div", { class: "dots" });
      MEALS.forEach(function (m) {
        var s = slotDoc(k, m.key);
        dots.appendChild(el("span", { class: "dot" + (s && s.status === "confirmed" ? " on" : s && s.status === "pending" ? " wait" : "") + (future ? " future" : "") }));
      });
      week.appendChild(el("div", { class: "day" + (k === todayKey ? " today" : "") }, [el("span", { class: "d", text: names[i] }), dots]));
    }
    app.appendChild(el("section", { id: "week", class: "panel" }, [
      el("h2", { text: "本週" }), week,
      el("p", { class: "legend", text: "每天三顆點，由上到下是早餐、午餐、晚餐。紅色是已領，黃色是等確認。" })
    ]));

    // 紀錄
    var visible = docs.filter(function (d) { return d.status !== "rejected" || !isHer ? true : true; })
      .sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); }).slice(0, 40);
    var log = el("ul", { class: "log" });
    if (!visible.length) log.appendChild(el("li", {}, [el("span", { class: "when" }), el("span", { class: "what", text: "還沒有紀錄。" })]));
    visible.forEach(function (d) {
      var tag = d.status === "pending" ? el("span", { class: "tag", text: "等確認" }) : d.status === "rejected" ? el("span", { class: "tag no", text: "已退回" }) : null;
      log.appendChild(el("li", {}, [
        el("span", { class: "when", text: shortDate(d.date) }),
        el("div", { class: "what" }, [
          el("div", {}, [el("b", { text: mealName(d.meal) }), tag]),
          d.note ? el("p", { class: "note", text: (isHer ? "我：" : "安安老大：") + d.note }) : null,
          d.reply ? el("p", { class: "reply", text: (isHer ? "丞丞：" : "我：") + d.reply }) : null
        ])
      ]));
    });
    app.appendChild(el("section", { id: "log", class: "panel" }, [el("h2", { text: "領花紀錄" }), log]));
  }

  function shortDate(k) { var p = k.split("-"); return +p[1] + "/" + +p[2]; }
  function weekCount(info) {
    var t = new Date(), mon = new Date(t); mon.setDate(t.getDate() - ((t.getDay() + 6) % 7));
    var from = dateKey(mon), n = 0;
    info.confirmed.forEach(function (d) { if (d.date >= from) n++; });
    return n;
  }

  // ---------- 啟動 ----------
  function chooseRole() {
    var app = document.getElementById("app");
    app.textContent = "";
    app.appendChild(el("section", { class: "panel" }, [
      el("h2", { text: "你是誰？" }),
      el("div", { class: "row" }, [
        el("button", { class: "btn primary", text: "安安老大", onclick: function () { setRole("her"); } }),
        el("button", { class: "btn", text: "丞丞", onclick: function () {
          openSheet("輸入密語", "密語", "進入", function (v) { if (v === cfg.HIS_PIN) setRole("him"); else { toast("密語不對"); chooseRole(); } });
        } })
      ])
    ]));
  }
  function setRole(r) { try { localStorage.setItem("garden-role", r); } catch (e) {} start(r); }
  function start(r) {
    isHer = r !== "him";
    db = true;
    render();
    refresh();
    setInterval(function () { if (!busy && document.visibilityState === "visible") refresh(); }, 8000);
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") refresh(); });
  }
  if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY) { render(); return; }
  var saved = null;
  try { saved = localStorage.getItem("garden-role"); } catch (e) {}
  if (saved === "her" || saved === "him") start(saved); else chooseRole();
})();
</script>
<script type="module" src="hero.js"></script>
</body></html>
